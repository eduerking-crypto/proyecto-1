name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt
      - name: Sintaxis del frontend (node --check)
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/charts.js
          node --check frontend/js/app.js
          node --check frontend/sw.js
      - name: Tests backend
        run: python -m pytest tests -q
        working-directory: backend
      - name: Smoke test de la API
        run: |
          cd backend
          python -c "
          from database import init_db
          from fastapi.testclient import TestClient
          from main import app
          init_db()
          c = TestClient(app)
          r = c.get('/api/health')
          assert r.status_code == 200 and r.json()['status'] == 'ok'
          r2 = c.post('/api/analysis/polygenic/batch', json={'diseases': ['T2D'], 'simulated': True, 'seed': 1})
          assert r2.status_code == 200 and r2.json()['results']
          print('Smoke OK:', r.json())
          "
